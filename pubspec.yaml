name: snake_game
description: "Snake Buddy - A modern, responsive snake adventure powered by Entire Solution."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^5.2.1
  flame: ^1.33.0
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sprites/clearcode/
    - assets/sfx/
    - assets/fonts/
    - assets/splah_before.mp4

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf

flutter_native_splash:
  color: "#F5F9EE"
  image: assets/sprites/clearcode/head_right.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#F5F9EE"
    image: assets/sprites/clearcode/head_right.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#4CAF50"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"

